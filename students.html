{% extends 'base.html' %}{% block content %}<h2>Student management</h2><div class="row g-3"><div class="col-md-5"><div class="card p-3"><h5>Add student</h5><form method="post"><select class="form-select mb-2" name="level"><option>ND1</option><option>ND2</option></select><input class="form-control mb-2" name="student_id" placeholder="Student ID" required><input class="form-control mb-3" name="full_name" placeholder="Full name" required><button class="btn btn-primary">Save student</button></form><hr><h5>Upload CSV from Excel</h5><p>Columns: student_id, full_name</p><form method="post" action="/upload" enctype="multipart/form-data"><select class="form-select mb-2" name="level"><option>ND1</option><option>ND2</option></select><input class="form-control mb-3" type="file" name="file" accept=".csv" required><button class="btn btn-outline-primary">Upload list</button></form></div></div><div class="col-md-7"><div class="card p-3 table-responsive"><table class="table"><tr><th>Level</th><th>ID</th><th>Name</th></tr>{% for s in students %}<tr><td>{{s.level}}</td><td>{{s.student_id}}</td><td>{{s.full_name}}</td></tr>{% else %}<tr><td colspan="3">No students yet.</td></tr>{% endfor %}</table></div></div></div>{% endblock %}
