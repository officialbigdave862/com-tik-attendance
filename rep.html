{% extends 'base.html' %}{% block content %}<h2>{{level}} class attendance</h2><p>{{n}} students registered</p><div class="card p-3 table-responsive"><table class="table"><tr><th>Day</th><th>Time</th><th>Subject</th><th>Code</th><th>Lecturer</th><th></th></tr>{% for l in lessons %}<tr><td>{{l.day}}</td><td>{{l.start_time}}–{{l.end_time}}</td><td>{{l.subject}}</td><td>{{l.course_code}}</td><td>{{l.lecturer}}</td><td><a class="btn btn-sm btn-primary" href="/attendance/{{l.id}}">Mark attendance</a></td></tr>{% endfor %}</table></div>{% endblock %}
