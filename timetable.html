{% extends 'base.html' %}{% block content %}<h2>Timetable and lecturers</h2><p><a href="/timetable?level=ND1">ND1</a> · <a href="/timetable?level=ND2">ND2</a></p><div class="row g-3">{% for l in lessons %}<div class="col-md-6"><form class="card p-3" method="post"><input type="hidden" name="id" value="{{l.id}}"><input type="hidden" name="level" value="{{level}}"><b>{{l.day}} · {{l.start_time}}–{{l.end_time}}</b><label>Subject</label><input class="form-control mb-2" name="subject" value="{{l.subject}}"><label>Course code</label><input class="form-control mb-2" name="course_code" value="{{l.course_code}}"><label>Lecturer</label><input class="form-control mb-2" name="lecturer" value="{{l.lecturer}}"><button class="btn btn-primary">Save</button></form></div>{% endfor %}</div>{% endblock %}
