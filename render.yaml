services:
  - type: web
    name: soteria-attendance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ND1_PASSWORD
        sync: false
      - key: ND2_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
